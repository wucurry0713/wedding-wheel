<!doctype html>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    
    @keyframes resultReveal { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes confettiBurst {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
    }
    .result-reveal { animation: resultReveal 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    .confetti-dot {
      position: absolute; width: 10px; height: 10px; border-radius: 50%;
      animation: confettiBurst 1.2s ease-out forwards;
    }
    #wheel-canvas { transition: transform 0s; }
    #wheel-canvas.spinning { transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
    
    /* 婚紗照浮水印背景設定 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAJQAQMAAABpB0kBAAAABlBMVEUAAAD///+l2Z/dAAAAAXRSTlMAQObYZgAAACNJREFUeF7twQENAAAAwqD3T20PBxQAAAAAAAAAAAAAAODWAcgIAAG1GgR5AAAAAElFTkSuQmCC');
      background-size: cover;
      background-position: center;
      opacity: 0.18;
      filter: blur(5px) brightness(1.1);
      z-index: 0;
      pointer-events: none;
    }

    /* 祝福泡泡飄浮動畫 */
    @keyframes floatBubble {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .wish-bubble {
      animation: floatBubble 4s ease-in-out infinite;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .wish-bubble:hover {
      transform: scale(1.08) translateY(-4px);
      z-index: 30;
      box-shadow: 0 10px 25px -5px rgba(92, 78, 68, 0.2);
    }
    .wish-bubble.highlight {
      transform: scale(1.12);
      background: rgb(227, 213, 202) !important;
      border-color: rgb(180, 150, 135) !important;
      box-shadow: 0 0 20px rgba(199, 177, 159, 0.6);
      z-index: 40;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
</head>

        </div>
      </div>

        </div>
