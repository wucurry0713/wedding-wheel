<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prize Wheel</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    .chip { animation: chipIn 0.2s ease-out; }
    @keyframes chipIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
    /* 滿版震撼中獎彈窗出現動畫 */
    @keyframes resultRevealModal { 
      0% { transform: scale(0.5) translateY(30px); opacity: 0; filter: blur(6px); } 
      70% { transform: scale(1.03) translateY(-10px); opacity: 1; filter: blur(0px); }
      100% { transform: scale(1) translateY(0); opacity: 1; } 
    }
    @keyframes confettiBurst {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.6); opacity: 0; }
    }
    .result-modal-reveal { animation: resultRevealModal 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .confetti-dot {
      position: absolute; width: 14px; height: 14px; border-radius: 50%;
      animation: confettiBurst 1.8s ease-out forwards;
    }
    
    /* 轉盤旋轉時間 5.5 秒 */
    #wheel-canvas { transition: transform 0s; }
    #wheel-canvas.spinning { transition: transform 5.5s cubic-bezier(0.15, 0.7, 0.1, 0.99); }
    
    /* 全域背景：維持讀取 SMV00141.jpg 霧面浮水印 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(247, 243, 238, 0.85), rgba(247, 243, 238, 0.85)), url('SMV00141.jpg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }

    /* 中獎卡片內部背景：放入 SMV02162.jpg 仙女棒照片並加上柔和白幕 */
    #result-card {
      background: linear-gradient(rgba(255, 255, 255, 0.90), rgba(255, 255, 255, 0.90)), url('SMV02162.jpg');
      background-size: cover;
      background-position: center;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
</head>
<body class="w-full min-h-screen relative overflow-x-hidden flex items-center justify-center">
  
  <!-- 主遊戲畫面容器 (抽獎時顯示，得獎時隱藏) -->
  <main id="game-container" class="relative z-10 w-full max-w-[1500px] mx-auto px-4 sm:px-8 py-8 transition-opacity duration-500">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
      
      <!-- 左側：標題與祝福清單 (佔 5 欄) -->
      <div class="flex flex-col gap-6 lg:col-span-5 text-center lg:text-left">
        <header>
          <h1 class="text-5xl sm:text-6xl xl:text-7xl tracking-wider uppercase drop-shadow-sm" style="color: rgb(92, 78, 68); font-weight: 800;">Wedding Prize Wheel</h1>
          <p class="mt-3 text-xl sm:text-2xl font-semibold" style="color: rgb(112, 96, 86);">A special blessing for our wedding day!</p>
        </header>

        <!-- 側邊留言清單 -->
        <div class="w-full rounded-3xl p-6 sm:p-7 shadow-lg text-left flex flex-col backdrop-blur-md bg-white/90" style="border: 1px solid rgb(238, 230, 221); max-height: 580px;">
          <div class="flex justify-between items-center mb-4 pb-3 border-b border-gray-100">
            <span class="text-lg font-bold" style="color: rgb(92, 78, 68);">💌 Love & Blessings</span>
          </div>
          <div id="chips" class="flex flex-col gap-3 overflow-y-auto pr-1"></div>
        </div>
      </div>

      <!-- 右側：大尺寸轉盤與 GO 按鈕 (佔 7 欄) -->
      <div class="flex flex-col items-center gap-8 lg:col-span-7 lg:pl-4" style="transform: translateX(50px);">
        <div class="relative">
          <div class="absolute top-[-30px] left-1/2 -translate-x-1/2 z-20 w-0 h-0" style="border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid rgb(92, 78, 68);"></div>
          <!-- 轉盤實體與顯示尺寸 -->
          <canvas id="wheel-canvas" width="1000" height="1000" class="rounded-full shadow-2xl bg-white/95 backdrop-blur-sm" style="width:min(600px, 92vw); height:min(600px, 92vw);"></canvas>
        </div>
        
        <button id="spin-btn" class="rounded-full px-24 py-5 font-bold shadow-xl hover:scale-105 active:scale-95 transition-transform cursor-pointer tracking-wider" style="background: rgb(199, 177, 159); color: rgb(255, 255, 255); font-size: 28px;">
          GO
        </button>
      </div>

    </div>
  </main>

  <!-- 滿版霸氣中獎顯示彈窗 (照片背景在卡片框框內部) -->
  <div id="result-area" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-8 hidden backdrop-blur-sm bg-black/20">
    <!-- 卡片內部透過 CSS 套用 SMV02162.jpg 照片背景 -->
    <div id="result-card" class="w-full max-w-6xl rounded-[44px] p-12 sm:p-20 text-center relative overflow-hidden shadow-2xl border-4" style="border-color: rgb(215, 193, 178);">
      
      <p class="text-xl sm:text-3xl font-extrabold tracking-widest uppercase mb-4" style="color: rgb(160, 130, 115);">🎉 CONGRATULATIONS 🎉</p>
      <p class="text-base sm:text-lg font-bold tracking-wider mb-2" style="color: rgb(180, 150, 135);">幸運中獎得主</p>
      
      <!-- 得獎人名字 (超級大字體) -->
      <p id="result-name" class="font-black text-7xl sm:text-8xl xl:text-9xl my-8 tracking-wide drop-shadow-sm" style="color: rgb(92, 78, 68);"></p>
      
      <div class="mt-8 pt-6 border-t border-gray-200/60 max-w-2xl mx-auto">
        <p class="text-lg text-gray-500 mb-2 font-medium">Blessings：</p>
        <p id="result-wish" class="text-2xl sm:text-3xl italic px-8 py-6 rounded-3xl font-medium max-h-56 overflow-y-auto shadow-inner bg-white/80" style="color: rgb(112, 96, 86);"></p>
      </div>

      <!-- 重新抽獎 / 關閉按鈕 -->
      <div class="mt-10">
        <button id="close-result-btn" class="rounded-full px-16 py-5 font-bold shadow-lg hover:scale-105 active:scale-95 transition-transform cursor-pointer tracking-wider" style="background: rgb(92, 78, 68); color: rgb(255, 255, 255); font-size: 24px;">
          Back
        </button>
      </div>

    </div>
  </div>

  <script>
    const COLORS = ['#D9C5B2', '#E8DCC4', '#C7B19F', '#DFD3C3', '#B8A08E', '#EFEBD9', '#CCB6A4'];
