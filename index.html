<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prize Wheel</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    
    /* 滿版震撼中獎彈窗出現動畫 */
    @keyframes resultRevealModal { 
      0% { transform: scale(0.5) translateY(30px); opacity: 0; filter: blur(6px); } 
      70% { transform: scale(1.03) translateY(-10px); opacity: 1; filter: blur(0px); }
      100% { transform: scale(1) translateY(0); opacity: 1; } 
    }
    @keyframes confettiBurst {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.6); opacity: 0; }
    }
    .result-modal-reveal { animation: resultRevealModal 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .confetti-dot {
      position: absolute; width: 14px; height: 14px; border-radius: 50%;
      animation: confettiBurst 1.8s ease-out forwards;
    }
    
    /* 轉盤旋轉時間 9.5 秒 */
    #wheel-canvas { transition: transform 0s; }
    #wheel-canvas.spinning { transition: transform 9.5s cubic-bezier(0.15, 0.7, 0.1, 0.99); }
    
    /* 首頁背景：讀取 SMV00141.jpg 做為霧面浮水印背景 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(247, 243, 238, 0.85), rgba(247, 243, 238, 0.85)), url('SMV00141.jpg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }

    /* 中獎卡片內部背景：讀取 SMV02162.jpg 照片 */
    #result-card {
      background: linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.88)), url('SMV02162.jpg');
      background-size: cover;
      background-position: center;
    }

    /* === 底部質感跑馬燈設計 === */
    .marquee-wrapper {
      position: fixed;
      bottom: 0; left: 0; width: 100vw;
      background: rgba(247, 243, 238, 0.85); /* 呼應婚禮主題色，霧面透光 */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(215, 193, 178, 0.6);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
      padding: 18px 0;
      overflow: hidden;
      white-space: nowrap;
      z-index: 20;
    }
    .marquee-content {
      display: inline-block;
      animation: marquee-scroll 160s linear infinite; /* 設定一個優雅緩慢的速度 */
    }
    .marquee-content:hover {
      animation-play-state: paused; /* 滑鼠移過去會暫停，方便閱讀 */
    }
    @keyframes marquee-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); } /* 因為內容複製了兩份，移動50%剛好無縫接軌 */
    }
    .marquee-item {
      display: inline-block;
      margin-right: 5rem;
      font-size: 1.35rem;
      letter-spacing: 0.05em;
    }
    .marquee-name {
      font-weight: 800;
      color: rgb(92, 78, 68);
      margin-right: 0.75rem;
    }
    .marquee-wish {
      font-weight: 600;
      color: rgb(122, 106, 96);
    }
  </style>

    /* === 內建 Web Audio 音效引擎 === */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playWinSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const startTime = audioCtx.currentTime + idx * 0.12;
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.5);
      });
    }

    let spinning = false;
    let currentRotation = 0;
    let audioAnimId = null;

    const canvas = document.getElementById('wheel-canvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spin-btn');
    const gameContainer = document.getElementById('game-container');
    const resultArea = document.getElementById('result-area');
    const resultCard = document.getElementById('result-card');
    const closeResultBtn = document.getElementById('close-result-btn');
    const marqueeContent = document.getElementById('marquee-content');

    function drawWheel() {
      const w = canvas.width, h = canvas.height, cx = w/2, cy = h/2, r = w/2 - 12;
      ctx.clearRect(0,0,w,h);
      if (!guestData.length) return;
      const arc = (Math.PI*2)/guestData.length;
      
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); 
      ctx.strokeStyle = 'rgb(227, 213, 202)'; ctx.lineWidth = 8; ctx.stroke();
      
      guestData.forEach((item, i) => {
        const start = i * arc, end = start + arc;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,end); ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
        
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.stroke();
        
        ctx.save(); ctx.translate(cx,cy); ctx.rotate(start + arc/2);
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#5c4e44'; 
        
        ctx.font = `700 ${Math.min(45, 800/guestData.length)}px 'DM Sans', sans-serif`;
        ctx.fillText(item.name.length > 8 ? item.name.slice(0,7)+'…' : item.name, r - 20, 0);
        ctx.restore();
      });
    }

    /* 產生底部跑馬燈字串，並複製一份以達到無縫無限迴圈的效果 */
    function renderMarquee() {
      let htmlString = '';
      guestData.forEach((item) => {
        htmlString += `<span class="marquee-item"><span class="marquee-name">💌 ${item.name}</span><span class="marquee-wish">"${item.wish}"</span></span>`;
      });
      // 串接兩份完整的內容，讓卷軸可以完美無縫連接
      marqueeContent.innerHTML = htmlString + htmlString;
    }

    function spawnConfetti() {
      for (let i = 0; i < 80; i++) {
        const dot = document.createElement('div');
        dot.className = 'confetti-dot';
        dot.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
        const angle = Math.random() * Math.PI * 2;
        const distance = 120 + Math.random() * 200;
        dot.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
        dot.style.setProperty('--ty', SinCos(angle) * distance + 'px');
        dot.style.setProperty('--rot', Math.random() * 720 + 'deg');
        dot.style.left = '50%'; dot.style.top = '50%';
        dot.style.transform = 'translate(-50%, -50%)';
        dot.style.animationDuration = (1.5 + Math.random() * 0.8) + 's';
        resultCard.appendChild(dot);
        setTimeout(() => dot.remove(), 2200);
      }
    }

    function SinCos(angle) { return Math.sin(angle); }

    // 與 9.5 秒旋轉完美同步的音效節奏追蹤器
    function trackWheelAudio(targetDeg) {
      const startTime = performance.now();
      const duration = 9500; // 對應 9.5 秒
      const segmentDeg = 360 / guestData.length;
      let lastSegmentIndex = -1;

      function update() {
        const now = performance.now();
        const elapsed = now - startTime;
        if (elapsed < duration) {
          const progress = elapsed / duration;
          const easeOut = 1 - Math.pow(1 - progress, 3);
          const currentDeg = currentRotation - (targetDeg * (1 - easeOut));
          
          const currentSegmentIndex = Math.floor(currentDeg / segmentDeg);
          if (currentSegmentIndex !== lastSegmentIndex) {
            playTickSound();
            lastSegmentIndex = currentSegmentIndex;
          }
          audioAnimId = requestAnimationFrame(update);
        }
      }
      audioAnimId = requestAnimationFrame(update);
    }

    spinBtn.addEventListener('click', () => {
      if (spinning || guestData.length < 2) return;
      spinning = true;
      spinBtn.style.opacity = '0.5';

      const totalDeg = (7 + Math.random()*3)*360 + Math.random()*360;
      currentRotation += totalDeg;
      canvas.classList.add('spinning');
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      // 啟動轉盤音效
      trackWheelAudio(totalDeg);

      // 配合你原本設定的 9.8 秒揭曉時間
      setTimeout(() => {
        canvas.classList.remove('spinning');
        spinning = false;
        spinBtn.style.opacity = '1';
        if (audioAnimId) cancelAnimationFrame(audioAnimId);

        const normalizedRotation = (currentRotation % 360 + 360) % 360;
        const topAngle = (270 - normalizedRotation + 360) % 360;
        const segmentAngle = 360 / guestData.length;
        const winIdx = Math.floor(topAngle / segmentAngle) % guestData.length;
        
        const winner = guestData[winIdx];
        document.getElementById('result-name').textContent = winner.name;
        document.getElementById('result-wish').textContent = `` + winner.wish + ``;
        
        gameContainer.style.opacity = '0';
        setTimeout(() => {
          gameContainer.classList.add('hidden');
          resultArea.classList.remove('hidden');
          resultCard.className = 'rounded-[44px] pt-10 pb-16 px-16 sm:px-28 text-center relative overflow-hidden shadow-2xl border-4 flex flex-col justify-between min-h-[680px] result-modal-reveal';
          playWinSound(); // 播放中獎歡慶音效
          spawnConfetti();
        }, 300);

      }, 9800);
    });

    // 點擊關閉/返回繼續抽獎按鈕
    closeResultBtn.addEventListener('click', () => {
      resultArea.classList.add('hidden');
      gameContainer.classList.remove('hidden');
      setTimeout(() => {
        gameContainer.style.opacity = '1';
      }, 50);
    });

    renderMarquee(); // 載入跑馬燈
    drawWheel();
  </script>
</body>
</html>
