<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prize Wheel</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    .chip { animation: chipIn 0.2s ease-out; }
    @keyframes chipIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes resultReveal { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes confettiBurst {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
    }
    .result-reveal { animation: resultReveal 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    .confetti-dot {
      position: absolute; width: 10px; height: 10px; border-radius: 50%;
      animation: confettiBurst 1.2s ease-out forwards;
    }
    #wheel-canvas { transition: transform 0s; }
    #wheel-canvas.spinning { transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
    
    /* 讀取同資料夾下的 SMV00141.jpg 做為霧面浮水印背景，並保持完美比例 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(247, 243, 238, 0.88), rgba(247, 243, 238, 0.88)), url('SMV00141.jpg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
</head>
<body class="w-full min-h-screen relative overflow-x-hidden flex items-center justify-center">
  <!-- 擴大滿版容器限制，大幅提升大螢幕上的滿版震撼感 -->
  <main class="relative z-10 w-full max-w-[1500px] mx-auto px-4 sm:px-8 py-8">
    <!-- 恢復 5/7 完美比例，確保大螢幕下絕對不會跑版或擠掉 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
      
      <!-- 左側：標題與祝福清單 (佔 5 欄) -->
      <div class="flex flex-col gap-6 lg:col-span-5 text-center lg:text-left">
        <header>
          <h1 class="text-5xl sm:text-6xl xl:text-7xl tracking-wider uppercase drop-shadow-sm" style="color: rgb(92, 78, 68); font-weight: 800;">Wedding Prize Wheel</h1>
          <p class="mt-3 text-xl sm:text-2xl font-semibold" style="color: rgb(112, 96, 86);">A special blessing for our wedding day!</p>
        </header>

        <!-- 側邊留言清單 -->
        <div class="w-full rounded-3xl p-6 sm:p-7 shadow-lg text-left flex flex-col backdrop-blur-md bg-white/90" style="border: 1px solid rgb(238, 230, 221); max-height: 560px;">
          <div class="flex justify-between items-center mb-4 pb-3 border-b border-gray-100">
            <span class="text-lg font-bold" style="color: rgb(92, 78, 68);">💌 Love & Blessings</span>
          </div>
          <div id="chips" class="flex flex-col gap-3 overflow-y-auto pr-1"></div>
        </div>
      </div>

      <!-- 右側：大尺寸轉盤與抽獎結果 (佔 7 欄，並適度向右微調距離) -->
      <div class="flex flex-col items-center gap-8 lg:col-span-7 lg:pl-4">
        <div class="relative">
          <div class="absolute top-[-30px] left-1/2 -translate-x-1/2 z-20 w-0 h-0" style="border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid rgb(92, 78, 68);"></div>
          <!-- 轉盤實體與顯示尺寸 -->
          <canvas id="wheel-canvas" width="1000" height="1000" class="rounded-full shadow-2xl bg-white/95 backdrop-blur-sm" style="width:min(520px, 92vw); height:min(520px, 92vw);"></canvas>
        </div>
        
        <button id="spin-btn" class="rounded-full px-20 py-5 font-bold shadow-xl hover:scale-105 active:scale-95 transition-transform cursor-pointer" style="background: rgb(199, 177, 159); color: rgb(255, 255, 255); font-size: 26px;">
          開始抽獎！
        </button>

        <!-- 中獎顯示區塊 -->
        <div id="result-area" class="w-full max-w-[520px] rounded-3xl p-7 text-center hidden relative overflow-hidden shadow-lg backdrop-blur-md bg-white/95" style="border: 2px solid rgb(227, 213, 202);">
          <p class="text-sm font-bold tracking-widest uppercase mb-1" style="color: rgb(180, 150, 135);">🎉 恭喜中獎得主 🎉</p>
          <p id="result-name" class="font-extrabold text-4xl my-3" style="color: rgb(92, 78, 68);"></p>
          <div class="mt-4 pt-3 border-t border-gray-100">
            <p class="text-sm text-gray-400 mb-1">賓客留下的小語：</p>
            <p id="result-wish" class="text-base italic px-5 py-3 rounded-2xl font-medium max-h-36 overflow-y-auto" style="background: rgb(247, 243, 238); color: rgb(112, 96, 86);"></p>
          </div>
        </div>
      </div>

    </div>
