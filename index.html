<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>婚禮祝福抽紅包系統</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    .chip { animation: chipIn 0.2s ease-out; }
    @keyframes chipIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes resultReveal { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes confettiBurst {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
    }
    .result-reveal { animation: resultReveal 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    .confetti-dot {
      position: absolute; width: 10px; height: 10px; border-radius: 50%;
      animation: confettiBurst 1.2s ease-out forwards;
    }
    #wheel-canvas { transition: transform 0s; }
    #wheel-canvas.spinning { transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
    
    /* 背景比例完美呈現 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(247, 243, 238, 0.88), rgba(247, 243, 238, 0.88)), url('SMV00141.jpg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
</head>
<body class="w-full min-h-screen relative overflow-x-hidden flex items-center justify-center">
  <main class="relative z-10 w-full max-w-7xl mx-auto px-6 py-10">
    <!-- 透過 grid gap 讓左右兩側拉開距離，轉盤往右移不遮到新郎 -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-16 items-center">
      
      <!-- 左側：英文標題與留言檢視列表 -->
      <div class="flex flex-col gap-6 md:col-span-5 text-center md:text-left">
        <header>
          <h1 class="text-5xl md:text-6xl tracking-wider uppercase drop-shadow-sm" style="color: rgb(92, 78, 68); font-weight: 800;">Wedding Lucky Draw</h1>
          <p class="mt-2 text-lg md:text-xl font-medium" style="color: rgb(112, 96, 86);">尋找現場最幸運的賓客抽大獎！</p>
        </header>

        <!-- 側邊留言清單 -->
        <div class="w-full rounded-2xl p-6 shadow-md text-left flex flex-col backdrop-blur-md bg-white/90" style="border: 1px solid rgb(238, 230, 221); max-height: 520px;">
          <div class="flex justify-between items-center mb-3 pb-3 border-b border-gray-100">
            <span class="text-base font-bold" style="color: rgb(92, 78, 68);">📋 留下的祝福列表 (<span id="count-num">48</span>)</span>
            <span class="text-xs text-gray-400">可上下滾動檢視</span>
          </div>
          <div id="chips" class="flex flex-col gap-2.5 overflow-y-auto pr-1"></div>
        </div>
      </div>

      <!-- 右側：大尺寸轉盤與抽獎結果 (佔 7 欄，讓轉盤更往右推) -->
      <div class="flex flex-col items-center gap-6 md:col-span-7 md:pl-8">
        <div class="relative">
          <div class="absolute top-[-26px] left-1/2 -translate-x-1/2 z-20 w-0 h-0" style="border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid rgb(92, 78, 68);"></div>
          <canvas id="wheel-canvas" width="900" height="900" class="rounded-full shadow-xl bg-white/95 backdrop-blur-sm" style="width:min(480px,100vw);height:min(480px,100vw);"></canvas>
        </div>
        
        <button id="spin-btn" class="rounded-full px-16 py-4 font-bold shadow-lg hover:scale-105 active:scale-95 transition-transform cursor-pointer" style="background: rgb(199, 177, 159); color: rgb(255, 255, 255); font-size: 22px;">
          開始抽獎！
        </button>

        <!-- 中獎顯示區塊 -->
        <div id="result-area" class="w-full max-w-[480px] rounded-2xl p-6 text-center hidden relative overflow-hidden shadow-md backdrop-blur-md bg-white/95" style="border: 2px solid rgb(227, 213, 202);">
          <p class="text-xs font-bold tracking-widest uppercase mb-1" style="color: rgb(180, 150, 135);">🎉 恭喜中獎得主 🎉</p>
          <p id="result-name" class="font-extrabold text-3xl my-2" style="color: rgb(92, 78, 68);"></p>
          <div class="mt-3 pt-3 border-t border-gray-100">
            <p class="text-xs text-gray-400 mb-1">賓客留下的小語：</p>
            <p id="result-wish" class="text-sm italic px-4 py-2.5 rounded-xl font-medium max-h-32 overflow-y-auto" style="background: rgb(247, 243, 238); color: rgb(112, 96, 86);"></p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const COLORS = ['#D9C5B2', '#E8DCC4', '#C7B19F', '#DFD3C3', '#B8A08E', '#EFEBD9', '#CCB6A4'];
